<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Architecture Visualizer</title>
    <style>
        body { background: #ffffff; margin: 0; overflow: hidden; font-family: sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; position: relative; cursor: grab; background: #fafafa; }
        #canvas-container:active { cursor: grabbing; }
        svg { width: 100%; height: 100%; display: block; }
        .bus-call-bg { stroke: #006400; stroke-width: 8px; opacity: 0.1; }
        .bus-data-bg { stroke: #00008B; stroke-width: 8px; opacity: 0.1; }
        .block-rect { fill: #ffffff; stroke: #000000; stroke-width: 1.5px; }
        .block-text { font-size: 13px; text-anchor: middle; dominant-baseline: middle; fill: #333; font-weight: bold; pointer-events: none; }
        .conn-segment { fill: none; pointer-events: none; }
        .hit-area { fill: none; stroke: transparent; stroke-width: 12px; pointer-events: stroke; cursor: pointer; }
        .dot { r: 3; pointer-events: all; cursor: pointer; }
        .tooltip {
            position: absolute; background: rgba(0,0,0,0.9); color: #fff; padding: 8px 12px;
            border-radius: 4px; font-size: 12px; pointer-events: none; visibility: hidden;
            z-index: 1000; font-family: monospace; max-width: 400px; word-break: break-all;
        }
        .stats-panel {
            position: fixed; top: 10px; right: 10px; background: rgba(0,0,0,0.6);
            color: white; padding: 5px 10px; border-radius: 5px; font-size: 11px; font-family: monospace;
        }
    </style>
</head>
<body>
<div id="canvas-container">
    <div id="tooltip" class="tooltip"></div>
    <svg id="main-svg">
        <g id="viewport">
            <line class="bus-call-bg" x1="-5000" y1="80" x2="5000" y2="80" />
            <line class="bus-data-bg" x1="-5000" y1="520" x2="5000" y2="520" />
            <g id="connections-layer"></g>
            <g id="blocks-layer">
                <g transform="translate(20, 275)"><rect class="block-rect" width="180" height="50" /><text class="block-text" x="90" y="25">Presentation</text></g>
                <g transform="translate(215, 275)"><rect class="block-rect" width="180" height="50" /><text class="block-text" x="90" y="25">Domain</text></g>
                <g transform="translate(410, 275)"><rect class="block-rect" width="180" height="50" /><text class="block-text" x="90" y="25">Data</text></g>
                <g transform="translate(605, 275)"><rect class="block-rect" width="180" height="50" /><text class="block-text" x="90" y="25">Infrastructure</text></g>
                <g transform="translate(800, 275)"><rect class="block-rect" width="180" height="50" /><text class="block-text" x="90" y="25">DI</text></g>
                <g transform="translate(995, 275)"><rect class="block-rect" width="185" height="50" /><text class="block-text" x="92" y="25">Common / Utils</text></g>
            </g>
            <g id="dots-layer"></g>
        </g>
    </svg>
</div>
<div id="stats-panel" class="stats-panel"></div>


<script>
    // При загрузке страницы запрашиваем данные у сервера
    document.addEventListener('DOMContentLoaded', async () => {
        try {
            const response = await fetch('/data.json');
            const data = await response.json();
            if (window.initVisualization) {
                window.initVisualization(data);
            }
        } catch (e) {
            console.error('Failed to load data:', e);
        }
    });
</script>
<script src="visualization.js"></script>
</body>
</html>
